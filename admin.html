<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#6f4b5b">
  <title>Nail Studio — администратор</title>
  <link rel="stylesheet" href="styles.css?v=30">
</head>
<body>
<header class="topbar">
  <div><div class="brand">Nail Studio — администратор</div><div class="sub">Закрытая панель управления</div></div>
  <div class="admin-top-actions">
    <button id="logoutButton" class="ghost hidden">Выйти</button>
    <a class="ghost" href="index.html">На сайт</a>
  </div>
</header>

<div class="admin-shell">
  <section id="authPanel" class="auth-card">
    <span class="eyebrow">Администратор</span>
    <h1>Вход в панель управления</h1>
    <p class="muted-copy">Для первого входа создайте пароль для разрешённого e-mail. В дальнейшем используйте кнопку «Войти».</p>
    <label class="field">
      <span>E-mail</span>
      <input id="adminEmail" type="email" autocomplete="username" placeholder="Ваш e-mail">
    </label>
    <label class="field">
      <span>Пароль</span>
      <input id="adminPassword" type="password" autocomplete="current-password" minlength="8" placeholder="Не менее 8 символов">
    </label>
    <div class="auth-actions">
      <button id="loginButton" class="primary">Войти</button>
      <button id="signupButton" class="ghost">Первый вход — создать пароль</button>
      <button id="resendButton" class="ghost">Отправить письмо ещё раз</button>
    </div>
    <div id="authMessage" class="auth-message"></div>
  </section>

  <div id="adminApp" class="hidden">
    <div class="admin-grid">
      <nav class="admin-nav">
        <button class="active" data-tab="today">Сегодня</button>
        <button data-tab="calendar">Календарь</button>
        <button data-tab="clients">Клиенты</button>
        <button data-tab="services">Услуги</button>
        <button data-tab="schedule">Рабочее время</button>
        <button data-tab="promo">Акции</button>
        <button data-tab="gallery">Галерея</button>
        <button data-tab="messages">Сообщения</button>
        <button data-tab="settings">Настройки</button>
      </nav>
      <section class="admin-content" id="adminContent"></section>
    </div>
  </div>
</div>

<script src="admin.js?v=30"></script>
</body>
</html>
